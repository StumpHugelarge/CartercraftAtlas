<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e1e">
<title>Cartercraft Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#1e1e1e;--panel:#2c2c2c;--panel2:#383838;--edge:#111;--hi:#5a5a5a;--txt:#f1f1f1;--mut:#a9a9a9;
  --grass:#5dbb3a;--grass-d:#3d8a24;--gold:#ffd24a;--red:#e5533d;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
/* header */
header{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;background:var(--panel);border-bottom:3px solid var(--edge);flex:0 0 auto}
.logo{font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.3;color:var(--grass);flex:1;min-width:0;text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:2px solid var(--edge);background:var(--panel2)}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--grass-d);color:#fff}
.ib{width:36px;height:36px;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 #222;font-size:16px;padding:0;line-height:1}
.ib:active{background:#444}
.ib[disabled]{opacity:.35}
/* stage */
#stage{position:relative;flex:1;min-height:0;touch-action:none;background:#12171f;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;background:rgba(20,20,20,.88);border:2px solid var(--edge);padding:7px 12px;font-size:13px;font-weight:600;display:none;text-align:center;z-index:5;pointer-events:none}
#hint.show{display:block}
#banner{position:absolute;left:0;right:0;top:12px;text-align:center;z-index:6;pointer-events:none;display:none}
#banner span{display:inline-block;background:rgba(20,20,20,.85);border:2px solid var(--gold);padding:8px 16px;font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold)}
#banner.show{display:block}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#111;border:2px solid var(--hi);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
/* toolbar */
nav{display:flex;background:var(--panel);border-top:3px solid var(--edge);padding-bottom:var(--safe-b);flex:0 0 auto;position:relative;z-index:12}
nav button{flex:1;border:0;background:transparent;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.2px}
nav button .e{font-size:19px;line-height:1.1}
nav button.on{color:#fff;background:var(--grass-d);box-shadow:inset 0 3px 0 var(--grass)}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:calc(58px + var(--safe-b));max-height:56%;overflow:auto;background:var(--panel);border-top:3px solid var(--edge);box-shadow:0 -4px 0 rgba(0,0,0,.25);padding:12px 14px 16px;z-index:11;display:none;-webkit-user-select:text;user-select:text}
#sheet.open{display:block}
#sheet h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
#sheet h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 #222;padding:9px 12px;font-weight:700;font-size:13px}
.btn:active{background:#4a4a4a}
.btn.pri{background:var(--grass-d);box-shadow:inset 2px 2px 0 var(--grass),inset -2px -2px 0 #25581a}
.btn.dan{background:#8a2b1f;box-shadow:inset 2px 2px 0 #c0473a,inset -2px -2px 0 #5a1a12}
.btn.sm{padding:6px 9px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:2px solid var(--edge);padding:7px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.chip.on{border-color:var(--gold);background:#4a4528}
.chip .sw{width:14px;height:14px;border:1px solid #000;display:inline-block}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:90px}
.field label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.field input,.field textarea,#sheet input[type=text],#sheet textarea{background:#171717;border:2px solid var(--edge);color:var(--txt);padding:9px 10px;font-size:16px;width:100%;font-family:inherit;border-radius:0}
.num{display:flex}
.num button{width:38px;flex:0 0 auto;background:var(--panel2);border:2px solid var(--edge);border-right:0;font-size:15px;font-weight:700}
.num input{min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid #3a3a3a}
.item:active{background:#3a3a3a}
.item .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#222;border:2px solid var(--edge);font-size:17px;flex:0 0 auto}
.item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .xy{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.muted{color:var(--mut);font-size:13px;line-height:1.4}
.tog{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #3a3a3a;font-weight:600}
.tog .sw{margin-left:auto;width:44px;height:24px;background:#171717;border:2px solid var(--edge);position:relative}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#777}
.tog.on .sw{background:var(--grass-d)}
.tog.on .sw::after{left:22px;background:#fff}
input[type=range]{width:100%;accent-color:var(--grass)}
input[type=color]{width:100%;height:40px;border:2px solid var(--edge);background:#171717;padding:2px}
</style>
</head>
<body>
<header>
  <div class="logo">CARTERCRAFT ATLAS</div>
  <div class="seg" id="viewseg"><button data-a="view" data-v="2d" class="on">2D</button><button data-a="view" data-v="3d">3D</button></div>
  <button class="ib" id="nightbtn" data-a="night" title="Day / night">🌙</button>
  <button class="ib" id="undobtn" data-a="undo" title="Undo" disabled>↶</button>
  <button class="ib" id="redobtn" data-a="redo" title="Redo" disabled>↷</button>
  <button class="ib" data-a="menu" title="Menu">☰</button>
</header>
<div id="stage">
  <canvas id="c2"></canvas>
  <canvas id="c3" style="display:none"></canvas>
  <canvas id="ov"></canvas>
  <div id="hint"></div>
  <div id="banner"><span id="bantxt"></span></div>
  <div id="toast"></div>
  <div id="sheet"></div>
</div>
<nav id="nav">
  <button data-a="mode" data-v="explore" class="on"><span class="e">🧭</span>Explore</button>
  <button data-a="mode" data-v="add"><span class="e">📍</span>Place</button>
  <button data-a="mode" data-v="biome"><span class="e">🌿</span>Biome</button>
  <button data-a="mode" data-v="road"><span class="e">🛤️</span>Road</button>
  <button data-a="sheet" data-v="list"><span class="e">📋</span>Places</button>
  <button data-a="sheet" data-v="layers"><span class="e">🗂️</span>Layers</button>
  <button data-a="tour" id="tourbtn"><span class="e">🎬</span>Tour</button>
</nav>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════════════════════
const KEY='cta-atlas-v1', UIKEY='cta-atlas-ui-v1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TYPES={
  home:   {label:'House',   icon:'🏠',layer:'builds', col:'#c8873a'},
  castle: {label:'Castle',  icon:'🏰',layer:'builds', col:'#9a9a9a'},
  tower:  {label:'Tower',   icon:'🗼',layer:'builds', col:'#b0b0b0'},
  village:{label:'Village', icon:'🏘️',layer:'builds', col:'#d2a15a'},
  temple: {label:'Temple',  icon:'🛕',layer:'builds', col:'#6f8a5a'},
  build:  {label:'Build',   icon:'🧱',layer:'builds', col:'#c9c2b0'},
  farm:   {label:'Farm',    icon:'🌾',layer:'farms',  col:'#d6b93a'},
  mine:   {label:'Mine',    icon:'⛏️',layer:'mines',  col:'#777777'},
  portal: {label:'Portal',  icon:'🌀',layer:'portals',col:'#9a4bff'},
  player: {label:'Player',  icon:'🧍',layer:'players',col:'#3aa6ff'},
};
const LAYERS=[
  ['builds','🏠','Builds'],['farms','🌾','Farms'],['mines','⛏️','Mines'],['portals','🌀','Portals'],
  ['players','🧍','Players'],['roads','🛤️','Roads'],['transit','🚇','Subway overlay'],['biomes','🌿','Biome colors'],
  ['chunks','🔲','Chunk grid'],['spawn','⭐','Spawn radius'],['labels','🔤','Labels'],
];
const BIOMES={
  plains:   {n:'Plains',   c:'#79b04a',h:.6},
  forest:   {n:'Forest',   c:'#4f8a3c',h:.85},
  darkforest:{n:'Dark forest',c:'#2f5a2c',h:.9},
  jungle:   {n:'Jungle',   c:'#2e8f2e',h:1.0},
  swamp:    {n:'Swamp',    c:'#5d7a4c',h:.2},
  desert:   {n:'Desert',   c:'#e3d08f',h:.6},
  badlands: {n:'Badlands', c:'#c9703b',h:1.2},
  snow:     {n:'Snowy',    c:'#eef4f7',h:1.0},
  mountains:{n:'Mountains',c:'#8a8f93',h:3.6},
  ocean:    {n:'Ocean',    c:'#2f5fb8',h:-1.4},
};
const ROADKINDS={
  path:  {n:'Path',  icon:'🟫',c:'#b8946a'},
  rail:  {n:'Rail',  icon:'🚃',c:'#8a8a8a'},
  nether:{n:'Nether highway',icon:'🔥',c:'#5a1f2b'},
  water: {n:'Boat route',icon:'⛵',c:'#4a7fd0'},
};

let D=null;                  // the saved map
let UI={hiddenLines:[],layers:{transit:1,builds:1,farms:1,mines:1,portals:1,players:1,roads:1,biomes:1,chunks:0,spawn:1,labels:1},night:false,view:'2d'};
let undoStack=[],redoStack=[];

function sampleMap(){
  const S=[
    ["Alan's Testing Grounds",1380,192,'build'],["Beach House",1158,-85,'home'],["Birch Giant",698,-14,'build'],
    ["Castle Gates",940,-6,'castle'],["Dark Village",1143,-318,'village'],["Dragon Ring",1223,-224,'portal'],
    ["Frog Temple",932,479,'temple'],["Froghouse",731,52,'home'],["Giant Tree",1103,33,'build'],
    ["Hobbitton",1035,138,'village'],["Home",936,624,'home'],["Juliaville Aquarium",909,381,'build'],
    ["Knight's Den",940,-68,'castle'],["Purple Temple",633,36,'temple'],["Rosieville",1725,-261,'village'],
    ["Tardis",1417,-217,'build'],["The Red Castle",999,-123,'castle'],["The Wastelands",1646,-478,'build'],
    ["Tower Walk",1099,-223,'tower'],["Vader Plaza",1209,-360,'build'],["Valley Pond",1398,-481,'build'],
    ["Wastelands 2",1294,203,'build'],["Woodbridge",682,96,'village'],["Farm",969,237,'farm'],
    ["Subway End",781,412,'build'],["Crab Castle",774,-4,'castle'],["Balloon",584,388,'build'],
    ["Darquarium",408,516,'build'],["Mountain House",926,825,'home'],["Ice Fall",1022,1041,'build'],
  ];
  const lm=S.map((s,i)=>({id:i+1,name:s[0],x:s[1],z:s[2],y:null,type:s[3],note:'',color:null}));
  const id=n=>lm.find(l=>l.name===n).id;
  lm.push({id:31,name:'Steve',x:945,z:600,y:null,type:'player',note:'',color:'#3aa6ff'});
  const rg=[
    ['ocean',330,560,270],['snow',1022,1040,260],['mountains',926,830,210],['forest',700,0,260],
    ['darkforest',1143,-318,170],['badlands',1646,-478,230],['desert',1330,200,190],['jungle',932,479,150],
    ['swamp',731,60,120],
  ].map((r,i)=>({id:i+1,biome:r[0],x:r[1],z:r[2],r:r[3]}));
  const rd=[
    ['Castle Gates',"Knight's Den",'path'],["Knight's Den",'The Red Castle','path'],['Giant Tree','Hobbitton','path'],
    ['Home','Juliaville Aquarium','rail'],['Dragon Ring','Tower Walk','nether'],['Beach House','Giant Tree','water'],
  ].map((r,i)=>({id:i+1,from:id(r[0]),to:id(r[1]),kind:r[2],routing:r[2]==='nether'?'ortho':'straight'}));
  return {landmarks:lm,regions:rg,roads:rd,spawn:{x:936,z:560,r:128},nextId:100,transit:sampleTransit(S)};
}
function sampleTransit(S){
  const L=[['Northern Line','#c0392b',["Valley Pond","The Wastelands","Vader Plaza","Dragon Ring","Dark Village","Tower Walk","The Red Castle","Knight's Den"]],
    ['Central Line','#2980b9',["Purple Temple","Woodbridge","Birch Giant","Crab Castle","Froghouse","Castle Gates","Giant Tree","Hobbitton","Farm","Wastelands 2"]],
    ['Southern Line','#27ae60',["Balloon","Darquarium","Subway End","Juliaville Aquarium","Frog Temple","Home","Mountain House","Ice Fall"]],
    ['Eastern Express','#d4ac0d',["Beach House","Giant Tree","Alan's Testing Grounds","Tardis","Rosieville"]]];
  const t={stops:[],lines:[],connections:[]},sid={};
  S.forEach(r=>{if(L.some(l=>l[2].includes(r[0]))){sid[r[0]]=t.stops.length+1;t.stops.push({id:t.stops.length+1,name:r[0],x:r[1],z:r[2]})}});
  L.forEach((l,i)=>{t.lines.push({id:i+1,name:l[0],color:l[1]});l[2].forEach((n,j,a)=>{if(j<a.length-1)t.connections.push({from:sid[n],to:sid[a[j+1]],lineId:i+1,routing:'straight',bends:[]})})});
  return t;
}
function normTransit(t){
  const o={stops:[],lines:[],connections:[]};if(!t||typeof t!=='object')return o;
  (t.lines||[]).forEach(l=>o.lines.push({id:+l.id,name:String(l.name||'Line'),color:/^#[0-9a-f]{6}$/i.test(l.color)?l.color:'#cccccc'}));
  (t.stops||[]).forEach(s=>o.stops.push({id:+s.id,name:String(s.name||'Station'),x:+s.x||0,z:+s.z||0}));
  (t.connections||[]).forEach(c=>{
    if(!o.stops.some(s=>s.id===+c.from)||!o.stops.some(s=>s.id===+c.to)||!o.lines.some(l=>l.id===+c.lineId))return;
    let bends=Array.isArray(c.bends)?c.bends:[];if(!bends.length&&c.bendX!=null&&c.bendZ!=null)bends=[{x:c.bendX,z:c.bendZ}];
    o.connections.push({from:+c.from,to:+c.to,lineId:+c.lineId,routing:c.routing==='ortho'?'ortho':'straight',bends:bends.map(b=>({x:+b.x||0,z:+b.z||0}))});
  });
  return o;
}
const tStop=id=>D.transit.stops.find(s=>s.id===id);
function transitPts(c){
  const a=tStop(c.from),b=tStop(c.to);if(!a||!b)return null;
  return c.routing==='ortho'?[[a.x,a.z],...c.bends.map(p=>[p.x,p.z]),[b.x,b.z]]:[[a.x,a.z],[b.x,b.z]];
}
const lineHidden=id=>UI.hiddenLines.includes(id);
function interchanges(){
  const m={};D.transit.connections.forEach(c=>{[c.from,c.to].forEach(id=>{(m[id]=m[id]||new Set()).add(c.lineId)})});
  return m;
}

function normalize(d){
  const o={landmarks:[],regions:[],roads:[],spawn:{x:0,z:0,r:128},nextId:1,transit:normTransit(d.transit)};
  (d.landmarks||[]).forEach(l=>o.landmarks.push({id:+l.id,name:String(l.name||'Place'),x:+l.x||0,z:+l.z||0,
     y:(l.y===null||l.y===undefined||l.y==='')?null:+l.y,type:TYPES[l.type]?l.type:'build',note:l.note||'',color:l.color||null}));
  (d.regions||[]).forEach(r=>{if(BIOMES[r.biome])o.regions.push({id:+r.id,biome:r.biome,x:+r.x||0,z:+r.z||0,r:Math.max(20,+r.r||100)})});
  (d.roads||[]).forEach(r=>{if(ROADKINDS[r.kind]&&o.landmarks.some(l=>l.id===r.from)&&o.landmarks.some(l=>l.id===r.to))
     o.roads.push({id:+r.id,from:+r.from,to:+r.to,kind:r.kind,routing:r.routing==='ortho'?'ortho':'straight'})});
  if(d.spawn&&typeof d.spawn==='object')o.spawn={x:+d.spawn.x||0,z:+d.spawn.z||0,r:Math.max(16,+d.spawn.r||128)};
  const maxId=Math.max(0,...o.landmarks.map(l=>l.id),...o.regions.map(r=>r.id),...o.roads.map(r=>r.id));
  o.nextId=Math.max(+d.nextId||1,maxId+1);
  return o;
}

// ═══════════════════════════════════════════════════════════════════════════
//  HISTORY + AUTOSAVE
// ═══════════════════════════════════════════════════════════════════════════
const snap=()=>JSON.stringify(D);
function pushUndo(){const s=snap();if(undoStack[undoStack.length-1]===s)return;undoStack.push(s);if(undoStack.length>100)undoStack.shift();redoStack.length=0;histBtns()}
function histBtns(){$('undobtn').disabled=!undoStack.length;$('redobtn').disabled=!redoStack.length}
function undo(){if(!undoStack.length)return;redoStack.push(snap());D=JSON.parse(undoStack.pop());afterHistory()}
function redo(){if(!redoStack.length)return;undoStack.push(snap());D=JSON.parse(redoStack.pop());afterHistory()}
function afterHistory(){if(selectedId&&!lmById(selectedId))selectedId=null;if(form&&form.id&&!lmById(form.id))form=null;changed(true);histBtns();renderSheet()}
let saveT=null,warned=false;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){try{localStorage.setItem(KEY,snap())}catch(e){if(!warned){warned=true;toast('Could not autosave on this device — use Export to keep a copy.')}}}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}}
function loadSaved(){
  try{const u=localStorage.getItem(UIKEY);if(u){const o=JSON.parse(u);UI.layers=Object.assign(UI.layers,o.layers||{});UI.night=!!o.night;UI.hiddenLines=Array.isArray(o.hiddenLines)?o.hiddenLines:[];UI.view=o.view==='3d'?'3d':'2d'}}catch(e){}
  try{const s=localStorage.getItem(KEY);if(s){D=normalize(JSON.parse(s));return true}}catch(e){}
  return false;
}
addEventListener('pagehide',()=>{if(D)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&D)saveNow()});

// mutate with history
function commit(fn,terrain=true){pushUndo();fn();changed(terrain)}
let terrainDirty=true,stale3D=true,dirty=true;
function changed(terrain=true){if(terrain)terrainDirty=true;stale3D=true;dirty=true;scheduleSave()}
const lmById=id=>D.landmarks.find(l=>l.id===id);
const newId=()=>D.nextId++;

// ═══════════════════════════════════════════════════════════════════════════
//  TERRAIN (shared by 2D and 3D)
// ═══════════════════════════════════════════════════════════════════════════
let G=null,tc=null,TH=null,TB=null,TR=null,TG=null,TBL=null;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixC=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function hsh(i,j){const n=Math.sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  return (hsh(i,j)*(1-u)+hsh(i+1,j)*u)*(1-v)+(hsh(i,j+1)*(1-u)+hsh(i+1,j+1)*u)*v}
function sampleTerrain(wx,wz){
  let ws=.3,hs=.3*BIOMES.plains.h,best='plains',bw=0;
  D.regions.forEach((r,i)=>{
    const d=Math.hypot(wx-r.x,wz-r.z)/r.r;if(d>=1.25)return;
    const w=Math.pow((1.25-d)/1.25,1.5)*3+i*1e-4;

function pan3D(dx,dy){
  const s=V3.dist*.0021,sn=Math.sin(V3.yaw),cs=Math.cos(V3.yaw);
  V3.tx+=(-dx*cs-dy*sn)*s*16;V3.tz+=(dx*sn-dy*cs)*s*16;
  V3.tx=clamp(V3.tx,G.x0,G.x0+G.nx*G.cs);V3.tz=clamp(V3.tz,G.z0,G.z0+G.nz*G.cs);
}
function endPtr(e){
  const o=ptrs.get(e.pointerId);if(!o)return;ptrs.delete(e.pointerId);
  if(gs&&ptrs.size===0){
    const tap=!gs.moved&&performance.now()-gs.t<600&&e.type==='pointerup';
    if(gs.drag&&gs.drag.started){renderSheet()}
    if(tap)onTap(o.x,o.y);
    gs=null;
  }
}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{
  if(e.target.closest('#sheet'))return;e.preventDefault();const f=Math.exp(-e.deltaY*.0015);
  if(view==='2d'){const p=ptXY(e),wx=V2.x+(p.x-W/2)/V2.k,wz=V2.z+(p.y-H/2)/V2.k;V2.k=clamp(V2.k*f,.04,8);V2.x=wx-(p.x-W/2)/V2.k;V2.z=wz-(p.y-H/2)/V2.k}
  else V3.dist=clamp(V3.dist/f,6,600);
  dirty=true;
},{passive:false});

function onTap(px,py){
  const hit=hitTest(px,py);
  if(mode==='explore'){
    if(spawnPick){const w=screenToWorld(px,py);if(w){commit(()=>{D.spawn.x=w.x;D.spawn.z=w.z});spawnPick=false;hint('');toast('Spawn moved to '+w.x+', '+w.z);renderSheet()}return}
    const ts=!hit&&tScreen.filter(t=>Math.hypot(t.x-px,t.y-py)<18).sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py))[0];
    if(ts){toast('🚇 '+ts.st.name+' · '+ts.lines.map(id=>D.transit.lines.find(l=>l.id===id).name).join(', '));return}
    if(hit){if(selectedId===hit.id){selectedId=null;closeSheet()}else{selectedId=hit.id;sheetMode='detail';renderSheet()}}
    else if(selectedId){selectedId=null;closeSheet()}
    stale3D=true;dirty=true;return;
  }
  if(mode==='add'){
    const w=screenToWorld(px,py);if(!w)return;
    form=Object.assign(form&&!form.id?form:{id:null,name:'',type:'build',y:'',note:'',color:'#3aa6ff'},{x:w.x,z:w.z});
    pending={x:w.x,z:w.z};sheetMode='form';renderSheet();dirty=true;return;
  }
  if(mode==='biome'){
    const w=screenToWorld(px,py);if(!w)return;
    if(biomePick==='erase'){
      let bi=-1;D.regions.forEach((r,i)=>{if(Math.hypot(w.x-r.x,w.z-r.z)<r.r)bi=i});
      if(bi<0){toast('No biome patch there');return}
      commit(()=>D.regions.splice(bi,1));return;
    }
    commit(()=>D.regions.push({id:newId(),biome:biomePick,x:w.x,z:w.z,r:biomeR}));return;
  }
  if(mode==='road'){
    if(!hit){roadFrom=null;hint('Tap the first place for the road');dirty=true;return}
    if(hit.type==='player'){toast('Roads connect places, not players');return}
    if(!roadFrom){roadFrom=hit.id;hint('Now tap the place it leads to');dirty=true;return}
    if(roadFrom===hit.id){roadFrom=null;hint('Tap the first place for the road');dirty=true;return}
    const a=roadFrom,b=hit.id;
    if(D.roads.some(r=>r.kind===roadKind&&((r.from===a&&r.to===b)||(r.from===b&&r.to===a)))){toast('That road already exists');roadFrom=null;dirty=true;return}
    commit(()=>D.roads.push({id:newId(),from:a,to:b,kind:roadKind,routing:roadRouting}),false);
    roadFrom=null;hint('Road added — tap another pair, or switch tools');toast('Road added');
  }
}

let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function hint(m){const h=$('hint');if(m){h.textContent=m;h.classList.add('show')}else h.classList.remove('show')}
function closeSheet(){sheetMode='none';renderSheet()}
function setMode(m){
  stopTour();mode=m;roadFrom=null;spawnPick=false;pending=(m==='add'&&form&&!form.id&&sheetMode==='form')?pending:null;
  if(m!=='add')form=null;
  document.querySelectorAll('#nav button[data-a=mode]').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  if(m==='explore'){hint('');if(['biome','road','form'].includes(sheetMode))sheetMode=selectedId?'detail':'none'}
  if(m==='add'){selectedId=null;hint('Tap the map where you want the new place');if(!form){sheetMode='none'}}
  if(m==='biome'){selectedId=null;sheetMode='biome';hint('Tap the map to paint a biome patch')}
  if(m==='road'){selectedId=null;sheetMode='road';hint('Tap the first place for the road')}
  renderSheet();dirty=true;stale3D=true;
}
const numField=(id,label,val)=>`<div class="field"><label>${label}</label><div class="num"><button data-a="neg" data-v="${id}">±</button><input id="${id}" type="text" inputmode="decimal" autocomplete="off" value="${val===null||val===undefined?'':val}"></div></div>`;
const estY=l=>l.y!==null?l.y:Math.round(63+16*(groundY(l)));
function renderSheet(){
  const s=$('sheet');
  document.querySelectorAll('#nav button[data-a=sheet]').forEach(b=>b.classList.toggle('on',b.dataset.v===sheetMode));
  if(sheetMode==='none'||!D){s.classList.remove('open');s.innerHTML='';return}
  s.classList.add('open');
  const keepScroll=s.dataset.mode===sheetMode?s.scrollTop:0;
  s.innerHTML=SHEETS[sheetMode]?SHEETS[sheetMode]():'';s.dataset.mode=sheetMode;s.scrollTop=keepScroll;
}
const SHEETS={
  detail(){
    const l=lmById(selectedId);if(!l)return'';const t=TYPES[l.type];
    const roads=D.roads.filter(r=>r.from===l.id||r.to===l.id);
    return `<h3>${t.icon} ${esc(l.name)}</h3>
    <div class="muted">${t.label} · X ${l.x}, Z ${l.z} · Y ${l.y!==null?l.y:'≈'+estY(l)}${l.note?'<br>'+esc(l.note):''}</div>
    <div class="row"><button class="btn pri" data-a="edit">✏️ Edit</button><button class="btn" data-a="focus">🎯 Center</button><button class="btn" data-a="tp">📋 /tp</button><button class="btn dan" data-a="del">🗑</button></div>
    ${roads.length?'<h4>Roads here</h4>'+roads.map(r=>{const o=lmById(r.from===l.id?r.to:r.from);return `<div class="item"><span class="ic">${ROADKINDS[r.kind].icon}</span><span class="nm">${ROADKINDS[r.kind].n} → ${esc(o?o.name:'?')}</span><button class="btn sm" data-a="delroad" data-v="${r.id}">✕</button></div>`}).join(''):''}`;
  },
  form(){
    const f=form||{};
    return `<h3>${f.id?'Edit place':'New place'}</h3>
    <div class="field"><label>Name</label><input id="fname" type="text" value="${esc(f.name||'')}" placeholder="e.g. Diamond Mine" autocomplete="off"></div>
    <h4>Type</h4><div class="chips">${Object.keys(TYPES).map(k=>`<button class="chip ${f.type===k?'on':''}" data-a="ftype" data-v="${k}">${TYPES[k].icon} ${TYPES[k].label}</button>`).join('')}</div>
    <div class="row">${numField('fx','X (east +)',f.x)}${numField('fz','Z (south +)',f.z)}${numField('fy','Y (optional)',f.y)}</div>
    ${f.type==='player'?'<div class="field"><label>Color</label><input id="fcolor" type="color" value="'+(f.color||'#3aa6ff')+'"></div>':''}
    <div class="field" style="margin-top:8px"><label>Note</label><textarea id="fnote" rows="2" placeholder="Anything worth remembering">${esc(f.note||'')}</textarea></div>
    <p class="muted">Leave Y empty to sit on the terrain. A Y level lifts the build to that height (sea level is 63).</p>
    <div class="row"><button class="btn pri" data-a="fsave">✔ Save</button><button class="btn" data-a="fcancel">Cancel</button></div>`;
  },
  list(){
    const q=(SHEETS._q||'').toLowerCase();
    const items=D.landmarks.filter(l=>!q||l.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
    return `<h3>📋 Places <span class="muted" style="font-weight:400">(${D.landmarks.length})</span></h3>
    <input type="text" id="lq" placeholder="Search…" value="${esc(SHEETS._q||'')}" autocomplete="off" style="margin-bottom:6px">
    ${items.map(l=>`<div class="item" data-a="pick" data-v="${l.id}"><span class="ic">${TYPES[l.type].icon}</span><span class="nm">${esc(l.name)}</span><span class="xy">${l.x}, ${l.z}</span></div>`).join('')||'<p class="muted">No places match.</p>'}`;
  },
  layers(){
    return `<h3>🗂️ Layers & world</h3>
    ${LAYERS.map(([k,ic,n])=>`<div class="tog ${UI.layers[k]?'on':''}" data-a="layer" data-v="${k}"><span>${ic}</span><span>${n}</span><span class="sw"></span></div>`).join('')}
    ${D.transit.lines.length?'<h4>Subway lines</h4>'+D.transit.lines.map(l=>`<div class="tog ${lineHidden(l.id)?'':'on'}" data-a="line" data-v="${l.id}"><span class="sw" style="position:static;margin:0;width:22px;height:12px;background:${l.color}"></span><span>${esc(l.name)}</span><span class="sw"></span></div>`).join(''):'<p class="muted">No subway overlay yet — import one from ☰ Map.</p>'}
    <h4>World spawn</h4>
    <div class="row">${numField('sx','X',D.spawn.x)}${numField('sz','Z',D.spawn.z)}${numField('sr','Radius',D.spawn.r)}</div>
    <div class="row"><button class="btn pri" data-a="spawnsave">Save spawn</button><button class="btn" data-a="spawnpick">📍 Pick on map</button></div>
    <p class="muted">Chunk grid lines are 16 blocks apart (zooming out groups them). The grid shows on the 2D map.</p>`;
  },
  biome(){
    return `<h3>🌿 Biome painter</h3>
    <div class="chips">${Object.keys(BIOMES).map(k=>`<button class="chip ${biomePick===k?'on':''}" data-a="bpick" data-v="${k}"><span class="sw" style="background:${BIOMES[k].c}"></span>${BIOMES[k].n}</button>`).join('')}
    <button class="chip ${biomePick==='erase'?'on':''}" data-a="bpick" data-v="erase">🧽 Erase patch</button></div>
    <h4>Patch radius: <span id="brl">${biomeR}</span> blocks</h4>
    <input type="range" id="brange" min="40" max="500" step="20" value="${biomeR}">
    <p class="muted">Tap the map to stamp a patch. Heights follow the biome — oceans sink, mountains rise — and show up in 3D.</p>`;
  },
  road(){
    return `<h3>🛤️ Roads & routes</h3>
    <div class="chips">${Object.keys(ROADKINDS).map(k=>`<button class="chip ${roadKind===k?'on':''}" data-a="rkind" data-v="${k}">${ROADKINDS[k].icon} ${ROADKINDS[k].n}</button>`).join('')}</div>
    <h4>Shape</h4>
    <div class="chips"><button class="chip ${roadRouting==='straight'?'on':''}" data-a="rroute" data-v="straight">╱ Straight</button><button class="chip ${roadRouting==='ortho'?'on':''}" data-a="rroute" data-v="ortho">└ L-shaped</button></div>
    <p class="muted">Tap one place, then another. Remove a road from a place's detail card.</p>`;
  },
  menu(){
    return `<h3>☰ Map</h3>
    <div class="row"><button class="btn" data-a="fitview">⤢ Fit whole map</button><button class="btn" data-a="savepic">🖼️ Save picture</button></div>
    <h4>Backup</h4>
    <div class="row"><button class="btn" data-a="copyjson">Copy JSON</button><button class="btn" data-a="dljson">Download .json</button><button class="btn" data-a="pastetoggle">Paste JSON</button><label class="btn" style="display:inline-block">Import file<input type="file" id="ifile" accept=".json,application/json" style="display:none"></label></div>
    <div id="pastebox" style="display:none"><textarea id="ptxt" rows="5" placeholder="Paste exported JSON here"></textarea><div class="row"><button class="btn pri" data-a="pasteimport">Import</button></div></div>
    <h4>Subway overlay</h4>
    <div class="row"><button class="btn" data-a="loadsub">Load sample subway</button><button class="btn dan" data-a="clearsub">Remove overlay</button></div>
    <p class="muted">To add your own, use Paste JSON or Import file with a map exported from the Subway Planner — it is detected automatically.</p>
    <h4>Start over</h4>
    <div class="row"><button class="btn dan" data-a="reset">Reset to sample map</button></div>
    <p class="muted">Your map autosaves on this device. Undo history is not kept after you close the app.</p>`;
  },
};
function openFormFor(l){form={id:l.id,name:l.name,type:l.type,x:l.x,z:l.z,y:l.y===null?'':l.y,note:l.note,color:l.color||'#3aa6ff'};pending=null;sheetMode='form';renderSheet()}
function readForm(){
  const g=id=>{const e=$(id);return e?e.value:''};
  const num=s=>{const v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:null};
  form.name=g('fname').trim();form.note=g('fnote');
  form.x=num(g('fx'));form.z=num(g('fz'));const y=num(g('fy'));form.y=y===null?'':y;
  if($('fcolor'))form.color=g('fcolor');
}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function copyText(t){return (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()})}
function importJSON(txt){
  try{const raw=JSON.parse(txt);
    if(!raw.landmarks&&raw.stops&&raw.lines&&raw.connections){
      const t=normTransit(raw);if(!t.stops.length)throw 0;
      pushUndo();D.transit=t;UI.layers.transit=1;UI.hiddenLines=[];saveUI();changed(true);closeSheet();
      toast('Subway overlay loaded — '+t.stops.length+' stations, '+t.lines.length+' lines');return}
    const d=normalize(raw);if(!d.landmarks.length&&!d.regions.length)throw 0;
    pushUndo();D=d;selectedId=null;changed(true);fit2D();fit3D();closeSheet();toast('Map loaded — '+d.landmarks.length+' places');
  }catch(e){toast('That does not look like an Atlas map file.')}
}
function savePicture(){
  const out=document.createElement('canvas');out.width=W*DPR;out.height=H*DPR;const c=out.getContext('2d');
  if(view==='3d'){if(stale3D)build3D();render3D();c.drawImage(c3,0,0,out.width,out.height)}else{draw2D();c.drawImage(c2,0,0,out.width,out.height)}
  drawOverlay();c.drawImage(ov,0,0,out.width,out.height);
  c.font='700 13px -apple-system,sans-serif';c.fillStyle='#fff';c.textAlign='right';c.textBaseline='bottom';c.strokeStyle='#000';c.lineWidth=3;
  c.setTransform(DPR,0,0,DPR,0,0);c.strokeText('Cartercraft Atlas',W-10,H-8);c.fillText('Cartercraft Atlas',W-10,H-8);
  out.toBlob(b=>{if(b){download(b,'cartercraft-atlas.png');toast('Picture saved')}else toast('Could not make a picture')},'image/png');
}

// delegated click handling
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'view':setView(v);break;
    case 'night':UI.night=!UI.night;saveUI();$('nightbtn').textContent=UI.night?'☀️':'🌙';applyDayNight();dirty=true;break;
    case 'undo':undo();break;case 'redo':redo();break;
    case 'menu':sheetMode=sheetMode==='menu'?'none':'menu';renderSheet();break;
    case 'mode':setMode(mode===v&&v!=='explore'?'explore':v);break;
    case 'sheet':
      if(sheetMode===v){closeSheet();break}
      if(mode!=='explore')setMode('explore');
      sheetMode=v;renderSheet();break;
    case 'tour':tour?stopTour():startTour();break;
    case 'neg':{const i=$(v);if(i){const s=i.value.trim();i.value=s.startsWith('-')?s.slice(1):('-'+s);i.dispatchEvent(new Event('input',{bubbles:true}))}break}
    case 'pick':{const l=lmById(+v);if(!l)break;selectedId=l.id;sheetMode='detail';renderSheet();focusOn(l);stale3D=true;dirty=true;break}
    case 'focus':{const l=lmById(selectedId);if(l)focusOn(l);break}
    case 'tp':{const l=lmById(selectedId);if(l){copyText(`/tp @s ${l.x} ${l.y!==null?l.y:estY(l)+1} ${l.z}`).then(()=>toast('Copied teleport command'))}break}
    case 'edit':{const l=lmById(selectedId);if(l)openFormFor(l);break}
    case 'del':{const l=lmById(selectedId);if(l&&confirm('Delete "'+l.name+'"?')){commit(()=>{D.landmarks=D.landmarks.filter(x=>x.id!==l.id);D.roads=D.roads.filter(r=>r.from!==l.id&&r.to!==l.id)});selectedId=null;closeSheet();toast('Deleted — Undo brings it back')}break}
    case 'delroad':commit(()=>{D.roads=D.roads.filter(r=>r.id!==+v)},false);renderSheet();break;
    case 'ftype':readForm();form.type=v;renderSheet();break;
    case 'fcancel':form=null;pending=null;if(mode==='add'){hint('Tap the map where you want the new place');sheetMode='none'}else sheetMode=selectedId?'detail':'none';renderSheet();dirty=true;break;
    case 'fsave':{
      readForm();
      if(form.x===null||form.z===null){toast('Enter both X and Z');break}
      const f=form;const name=f.name||TYPES[f.type].label;
      if(f.id){commit(()=>{const l=lmById(f.id);Object.assign(l,{name,type:f.type,x:Math.round(f.x),z:Math.round(f.z),y:f.y===''?null:Math.round(f.y),note:f.note,color:f.type==='player'?f.color:null})});selectedId=f.id;sheetMode='detail'}
      else{let nid;commit(()=>{nid=newId();D.landmarks.push({id:nid,name,type:f.type,x:Math.round(f.x),z:Math.round(f.z),y:f.y===''?null:Math.round(f.y),note:f.note,color:f.type==='player'?f.color:null})});
        selectedId=nid;sheetMode='detail';setMode('explore');selectedId=nid;sheetMode='detail'}
      form=null;pending=null;renderSheet();dirty=true;break}
    case 'line':{const i=UI.hiddenLines.indexOf(+v);if(i>=0)UI.hiddenLines.splice(i,1);else UI.hiddenLines.push(+v);saveUI();stale3D=true;dirty=true;renderSheet();break}
    case 'loadsub':commit(()=>{D.transit=sampleTransit(sampleMap().landmarks.map(l=>[l.name,l.x,l.z]))});UI.layers.transit=1;saveUI();toast('Sample subway loaded');renderSheet();break;
    case 'clearsub':if(D.transit.lines.length&&confirm('Remove the subway overlay? You can Undo this.')){commit(()=>{D.transit={stops:[],lines:[],connections:[]}});toast('Overlay removed')}break;
    case 'layer':UI.layers[v]=UI.layers[v]?0:1;saveUI();stale3D=true;dirty=true;renderSheet();break;
    case 'spawnsave':{const n=id=>parseFloat(($(id).value||'').replace(',','.'));const x=n('sx'),z=n('sz'),r=n('sr');
      if(![x,z,r].every(isFinite)){toast('Enter numbers for X, Z and radius');break}
      commit(()=>{D.spawn={x:Math.round(x),z:Math.round(z),r:Math.max(16,Math.round(r))}});toast('Spawn saved');break}
    case 'spawnpick':closeSheet();spawnPick=true;hint('Tap the map to set world spawn');break;
    case 'bpick':biomePick=v;renderSheet();break;
    case 'rkind':roadKind=v;renderSheet();break;
    case 'rroute':roadRouting=v;renderSheet();break;
    case 'fitview':fit2D();fit3D();closeSheet();break;
    case 'savepic':closeSheet();setTimeout(savePicture,80);break;
    case 'copyjson':copyText(JSON.stringify(D,null,2)).then(()=>toast('Map JSON copied'));break;
    case 'dljson':download(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),'cartercraft-atlas.json');toast('Map file saved');break;
    case 'pastetoggle':{const b=$('pastebox');b.style.display=b.style.display==='none'?'block':'none';break}
    case 'pasteimport':importJSON($('ptxt').value.trim());break;
    case 'reset':if(confirm('Replace your map with the sample map? You can Undo this.')){pushUndo();D=sampleMap();selectedId=null;changed(true);fit2D();fit3D();closeSheet();toast('Sample map loaded — Undo brings yours back')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lq'){SHEETS._q=t.value;const pos=t.selectionStart;renderSheet();const n=$('lq');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  else if(t.id==='brange'){biomeR=+t.value;$('brl').textContent=biomeR}
  else if((t.id==='fx'||t.id==='fz')&&form&&!form.id){
    const x=parseFloat(($('fx').value||'').replace(',','.')),z=parseFloat(($('fz').value||'').replace(',','.'));
    if(isFinite(x)&&isFinite(z)){pending={x,z};dirty=true}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='ifile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>importJSON(ev.target.result);r.onerror=()=>toast('Could not read that file');r.readAsText(f);e.target.value=''}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?redo():undo()}
});

if(UI.view==='3d')setView('3d');
requestAnimationFrame(frame);
window.__atlas={get D(){return D},get G(){return G},setView,V2,V3,get view(){return view}};
